name: Backend

on:
  pull_request:
    paths: ["backend/**", "frontend/**", "templates/**", "Dockerfile", ".dockerignore", ".github/workflows/backend.yml"]
  push:
    branches: [main]
    paths: ["backend/**", "frontend/**", "templates/**", "Dockerfile", ".dockerignore", ".github/workflows/backend.yml"]

jobs:
  tests:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run pytest

  docker:
    name: Docker smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t prelegal .
      - run: docker run -d --name prelegal -p 8000:8000 prelegal
      - name: Wait for the app
        run: timeout 60 bash -c 'until curl -sf http://localhost:8000/api/health; do sleep 1; done'
      - name: Check the pages
        run: |
          curl -sf http://localhost:8000/ | grep -q "Sign in"
          curl -sfL http://localhost:8000/nda | grep -q "Mutual NDA Creator"
      - if: failure()
        run: docker logs prelegal
